server {
    listen 80;
    listen [::]:80;
    server_name migim.example.com;
    # Certbot will redirect this to HTTPS — don't put content here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name migim.example.com;

    # TLS — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/migim.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migim.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Uploaded videos
    location /uploads/ {
        alias /var/www/migim/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Limit direct hotlinking from external domains (optional)
        valid_referers none blocked migim.example.com;
        if ($invalid_referer) { return 403; }
    }

    # API — proxy to Node/Express
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 210m;  # match multer 200 MB limit + headroom
    }

    # React SPA — static files
    root /var/www/migim/client/dist;
    index index.html;

    # Hashed assets → aggressive cache
    location ~* \.(js|css|woff2?|png|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA service worker — never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
